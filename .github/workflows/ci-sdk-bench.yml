name: ci-sdk bench
on:
  push:
    branches: [ci-sdk-bench]
  pull_request:
    branches: [ci-sdk-bench]
permissions:
  contents: read
jobs:
  bench:
    name: ${{ matrix.job }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        job: ["job"]
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 2 }
      - uses: pnpm/action-setup@v6
        with: { run_install: false }
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: pnpm
      - name: Restore bench caches
        uses: actions/cache@v6
        with:
          path: .bench-cache
          key: bench-${{ matrix.job }}-${{ github.event_name }}-${{ github.run_id }}
          restore-keys: |
            bench-${{ matrix.job }}-${{ github.event_name }}-
            bench-${{ matrix.job }}-
      - name: Install
        run: pnpm install --frozen-lockfile
        env: {"PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD":"1"}
      - name: Install ci-sdk
        run: npm install --prefix "$RUNNER_TEMP/ci-sdk" --no-save --no-audit --no-fund --no-package-lock "$PWD/.ci-sdk/ci-sdk.tgz"
      - name: Bench
        run: node .ci-sdk/harness.mjs .ci-sdk/config.json ${{ matrix.job }}
